<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Aurivon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1626"/>
      <stop offset="1" stop-color="#08070D"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EE6C5"/>
      <stop offset="0.5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#E35CFF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3C8"/>
      <stop offset="0.45" stop-color="#F6C453"/>
      <stop offset="1" stop-color="#C98A16"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- aurora ribbon -->
    <path d="M -10 214 C 90 96 210 70 300 96 C 380 118 440 92 530 40 L 530 120 C 440 170 380 186 300 168 C 210 148 110 176 -10 290 Z"
          fill="url(#aurora)" opacity="0.55" filter="url(#blur)"/>
    <path d="M 40 205 C 130 120 220 104 300 124 C 370 142 430 124 480 92"
          fill="none" stroke="url(#aurora)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- lyre -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 146 132 C 186 138 198 182 190 236 C 180 306 196 378 256 392 C 316 378 332 306 322 236 C 314 182 326 138 366 132" stroke-width="30"/>
    <path d="M 176 186 L 336 186" stroke-width="18"/>
  </g>
  <!-- strings -->
  <g stroke="#FFF3C8" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <line x1="218" y1="198" x2="218" y2="222"/>
    <line x1="294" y1="198" x2="294" y2="222"/>
  </g>
  <!-- play -->
  <path d="M 232 232 L 232 330 L 312 281 Z" fill="url(#gold)" stroke="url(#gold)" stroke-width="10" stroke-linejoin="round"/>
  <!-- base -->
  <path d="M 214 420 L 298 420" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
</svg>
