name: CI

on:
  push:
    branches: [master, main, feat/**]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      package: ${{ steps.filter.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            package:
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'packaging/**'
              - 'scripts/package.sh'
              - 'scripts/install.sh'
              - 'scripts/uninstall.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  check:
    name: Check & test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libclang-dev cmake \
            mpv ffmpeg

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

  package:
    name: Package Linux tarball
    runs-on: ubuntu-24.04
    needs: [changes, check]
    # Skip docs-only pushes. packaging/**-only still builds the tarball (check skipped).
    if: |
      always()
      && needs.changes.outputs.package == 'true'
      && needs.check.result != 'failure'
      && needs.check.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libclang-dev cmake

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64-release

      - name: Build package
        run: |
          # package.sh builds only --bin aurivon (not the whole workspace)
          TAR=$(./scripts/package.sh | tee /dev/stderr | tail -n 1)
          echo "TAR=$TAR" >> "$GITHUB_ENV"
          echo "SUM=${TAR}.sha256" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurivon-linux-x86_64
          path: |
            ${{ env.TAR }}
            ${{ env.SUM }}
          if-no-files-found: error
