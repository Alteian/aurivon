name: Release

# Builds Linux + Windows install packages and attaches them to the GitHub release
# for tag v*. Cut a release with scripts/release.sh, or workflow_dispatch an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package (e.g. v0.6.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package-linux:
    name: Linux x86_64 package
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev libvulkan-dev \
            libfontconfig1-dev libfreetype6-dev \
            libclang-dev cmake \
            clang mold

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64-release
          save-if: true

      - name: Build package
        run: |
          set -euo pipefail
          TAR=$(./scripts/package.sh | tail -n 1)
          SUM="${TAR}.sha256"
          test -f "$TAR"
          test -f "$SUM"
          echo "Built $TAR"
          {
            echo "AURIVON_TAR=$TAR"
            echo "AURIVON_SUM=$SUM"
          } >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAR="${AURIVON_TAR:?missing AURIVON_TAR from build step}"
          SUM="${AURIVON_SUM:?missing AURIVON_SUM from build step}"
          test -f "$TAR" && test -f "$SUM"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TAR" "$SUM" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$TAR" "$SUM" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Aurivon ${TAG#v}" \
              --generate-notes \
              --verify-tag
          fi
          echo "Release: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)"

  package-windows:
    name: Windows x86_64 package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x86_64-release
          save-if: true

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build zip + Setup installer (bundles mpv)
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          # workspace.package version is under [workspace.package]; package script already used it
          $zip = Get-ChildItem dist/aurivon-*-x86_64-windows.zip | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $setup = Get-ChildItem dist/aurivon-*-x86_64-windows-setup.exe -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { throw "zip not produced" }
          if (-not $setup) { throw "setup.exe not produced (is Inno Setup installed?)" }
          "AURIVON_ZIP=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AURIVON_ZIP_SUM=$($zip.FullName).sha256" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AURIVON_SETUP=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AURIVON_SETUP_SUM=$($setup.FullName).sha256" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "zip=$($zip.FullName)"
          Write-Host "setup=$($setup.FullName)"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in @($env:AURIVON_ZIP, $env:AURIVON_ZIP_SUM, $env:AURIVON_SETUP, $env:AURIVON_SETUP_SUM)) {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
          $exists = $true
          try { gh release view $env:TAG --repo $env:GITHUB_REPOSITORY | Out-Null } catch { $exists = $false }
          $files = @($env:AURIVON_ZIP, $env:AURIVON_ZIP_SUM, $env:AURIVON_SETUP, $env:AURIVON_SETUP_SUM)
          if ($exists) {
            gh release upload $env:TAG @files --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:TAG @files --repo $env:GITHUB_REPOSITORY --title "Aurivon $($env:TAG.TrimStart('v'))" --generate-notes --verify-tag
          }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json url -q .url
