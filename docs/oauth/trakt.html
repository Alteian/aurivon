<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurivon · Trakt</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #e8eaed; }
    main { max-width: 28rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
    p { margin: 0.5rem 0; color: #9aa0a6; line-height: 1.45; }
    code { font-size: 0.85em; word-break: break-all; color: #c5c8ce; }
    .ok { color: #81c995; }
    .err { color: #f28b82; }
  </style>
</head>
<body>
  <main>
    <h1>Aurivon</h1>
    <p id="msg">Finishing Trakt sign-in…</p>
    <p id="hint" hidden></p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");
      var state = params.get("state");
      var error = params.get("error");
      var msg = document.getElementById("msg");
      var hint = document.getElementById("hint");

      if (error) {
        msg.className = "err";
        msg.textContent = "Trakt denied the login (" + error + "). Return to Aurivon and try again.";
        return;
      }
      if (!code) {
        msg.className = "err";
        msg.textContent = "No authorization code in this URL.";
        hint.hidden = false;
        hint.textContent = "Open Trakt from Aurivon Settings → Services → Save & connect.";
        return;
      }

      var q = "code=" + encodeURIComponent(code);
      if (state) q += "&state=" + encodeURIComponent(state);
      var target = "http://127.0.0.1:18787/callback?" + q;

      fetch(target, { mode: "no-cors", cache: "no-store" })
        .then(function () {
          msg.className = "ok";
          msg.textContent = "Connected — you can close this tab and return to Aurivon.";
        })
        .catch(function () {
          // Fallback: navigate the tab itself (works even if fetch is blocked)
          window.location.replace(target);
          msg.className = "ok";
          msg.textContent = "Handing off to Aurivon…";
          hint.hidden = false;
          hint.innerHTML = "If nothing happens, copy this code into Aurivon:<br><code>" +
            code.replace(/</g, "&lt;") + "</code>";
        });

      // Also try a silent image/beacon navigate for older browsers
      setTimeout(function () {
        if (!document.hidden) {
          try {
            var img = new Image();
            img.src = target;
          } catch (e) {}
        }
      }, 400);
    })();
  </script>
</body>
</html>
